# /etc/postgresql/17/main/conf.d/chestlyace.conf (docs/hosting.md §3a).
# Sized for a 2 GB t3.small that also runs the site and its builds. Postgres
# listens on localhost only (its default); nothing outside the server reaches it.
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_connections = 30
